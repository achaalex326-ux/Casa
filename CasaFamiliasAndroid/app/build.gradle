plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'org.jetbrains.kotlin.plugin.compose' }
// La clave definitiva pertenece al propietario y se mantiene fuera de Git.
def uploadProperties = new Properties()
def uploadPropertiesFile = rootProject.file('casa-upload.properties')
if (uploadPropertiesFile.exists()) {
 uploadPropertiesFile.withInputStream { uploadProperties.load(it) }
 ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { key ->
  if (!uploadProperties.getProperty(key)?.trim()) throw new GradleException("Falta ${key} en casa-upload.properties")
 }
 if (uploadProperties.getProperty('keyAlias') == 'androiddebugkey') throw new GradleException('Usa una clave de subida propia para Google Play, no la clave debug.')
}
android {
 namespace 'com.casafamilias.app'
 compileSdk 36
 defaultConfig { applicationId 'com.casafamilias.app'; minSdk 26; targetSdk 36; versionCode 13; versionName '5.7'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
 buildFeatures { compose true; buildConfig true }
 signingConfigs {
  if (uploadPropertiesFile.exists()) {
   upload {
    storeFile rootProject.file(uploadProperties.getProperty('storeFile'))
    storePassword uploadProperties.getProperty('storePassword')
    keyAlias uploadProperties.getProperty('keyAlias')
    keyPassword uploadProperties.getProperty('keyPassword')
   }
  }
 }
 buildTypes {
  release {
   minifyEnabled true; shrinkResources true
   if (uploadPropertiesFile.exists()) signingConfig signingConfigs.upload
   proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
  }
  // APK compatible con las entregas anteriores; no se usa para publicar.
  presentation { initWith release; signingConfig signingConfigs.debug; matchingFallbacks=['release'] }
 }
}
dependencies {
 implementation platform('androidx.compose:compose-bom:2024.12.01')
 implementation 'androidx.activity:activity-compose:1.9.3'
 implementation 'androidx.biometric:biometric:1.1.0'
 implementation 'androidx.work:work-runtime-ktx:2.10.0'
 implementation 'androidx.compose.material3:material3'
 implementation 'androidx.compose.ui:ui'
 implementation 'androidx.compose.ui:ui-tooling-preview'
 implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
 implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
 implementation 'androidx.navigation:navigation-compose:2.8.5'
 implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
 implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0'
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
 implementation 'io.coil-kt:coil-compose:2.7.0'
 implementation 'com.google.mlkit:text-recognition:16.0.1'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
 testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
 androidTestImplementation platform('androidx.compose:compose-bom:2024.12.01')
 androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.work:work-testing:2.10.0'
 debugImplementation 'androidx.compose.ui:ui-test-manifest'
 debugImplementation 'androidx.compose.ui:ui-tooling'
}
