plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'org.jetbrains.kotlin.plugin.compose' }
android {
 namespace 'com.casafamilias.app'
 compileSdk 35
 defaultConfig { applicationId 'com.casafamilias.app'; minSdk 26; targetSdk 35; versionCode 6; versionName '5.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
 buildFeatures { compose true }
 buildTypes { release { minifyEnabled true; shrinkResources true; signingConfig signingConfigs.debug; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt') } }
 packaging { jniLibs { useLegacyPackaging true } }
}
dependencies {
 implementation platform('androidx.compose:compose-bom:2024.12.01')
 implementation 'androidx.activity:activity-compose:1.9.3'
 implementation 'androidx.compose.material3:material3'
 implementation 'androidx.compose.ui:ui'
 implementation 'androidx.compose.ui:ui-tooling-preview'
 implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
 implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
 implementation 'androidx.navigation:navigation-compose:2.8.5'
 implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
 implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0'
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
 implementation 'io.coil-kt:coil-compose:2.7.0'
 implementation 'com.google.mlkit:text-recognition:16.0.1'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
 testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
 androidTestImplementation platform('androidx.compose:compose-bom:2024.12.01')
 androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 debugImplementation 'androidx.compose.ui:ui-test-manifest'
 debugImplementation 'androidx.compose.ui:ui-tooling'
}
